<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>LAYER STUDIOS — 견적 산출기</title>
    <meta name="theme-color" content="#e8e5de">

    <!-- SVG를 우선 쓰고, 지원하지 않는 브라우저는 .ico로 떨어진다 -->
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="icon" href="favicon.ico" sizes="16x16 32x32 48x48">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <!-- Pretendard v1.3.9 자체 호스팅 (fonts/). 외부 CDN 의존 없음.
         동적 서브셋이라 브라우저는 화면에 실제 쓰인 글자의 조각만 내려받는다. -->
    <link rel="stylesheet" href="fonts/pretendard.css">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header class="masthead">
        <!-- 본문(.workbench)과 같은 폭·여백으로 맞춘다 -->
        <div class="mh-in">
            <span class="mh-logo">LAYER STUDIOS</span>
            <!-- 계산기 ↔ 요금표 전환. 요금표는 같은 지점·선택을 공유한다 -->
            <nav class="mh-nav" aria-label="화면 전환">
                <button data-view="calc" class="on" aria-pressed="true">견적 산출</button>
                <button data-view="sheet" aria-pressed="false">요금표</button>
            </nav>
        </div>
    </header>

    <main class="workbench">
        <!-- ── 조작 패널 ────────────────────────────── -->
        <section class="controls">
            <div class="row">
                <div class="row-h"><span class="row-n">01</span>Studio<em id="v-studio">한남</em></div>
                <div class="opts" id="opts-studio">
                    <button data-set="studio" data-v="HANNAM" class="on">한남</button>
                    <button data-set="studio" data-v="LAYER7">레이어 7</button>
                    <button data-set="studio" data-v="LAYER20">레이어 20</button>
                    <button data-set="studio" data-v="LAYER11">레이어 11</button>
                    <button data-set="studio" data-v="LAYER27">레이어 27</button>
                    <button data-set="studio" data-v="LAYER26">레이어 26</button>
                    <button data-set="studio" data-v="LAYER41">레이어 41</button>
                    <button data-set="studio" data-v="HONGDAE">홍대</button>
                </div>
            </div>

            <div class="row">
                <div class="row-h"><span class="row-n">02</span>Part<em id="v-part">1F</em></div>
                <div class="opts" id="opts-part"></div>
                <p class="note">가구 촬영 혹은 차량 내부 진입 시 별도 금액 협의</p>
            </div>

            <div class="row" id="row-type">
                <div class="row-h"><span class="row-n">03</span>Type<em id="v-type">사진</em></div>
                <div class="opts">
                    <button data-set="type" data-v="photo" class="on">사진</button>
                    <button data-set="type" data-v="video">영상</button>
                </div>
            </div>

            <div class="row">
                <div class="row-h"><span class="row-n">04</span>Personnel<em id="v-personnel">10명</em></div>
                <div class="slider">
                    <input type="range" data-rng="personnel" id="rng-personnel" min="1" max="80" value="10" step="1"
                        aria-label="촬영 인원">
                    <div class="scale"><span>01</span><span>80</span></div>
                </div>
            </div>

            <div class="row" id="row-time">
                <div class="row-h"><span class="row-n">05</span>Time<em id="v-time">Day 9h</em></div>
                <div class="opts" id="time-dayhalf">
                    <button data-set="time" data-v="day" class="on">DAY 9H</button>
                    <button data-set="time" data-v="half">HALF 4H</button>
                </div>
                <div class="slider" id="time-hourly" hidden>
                    <input type="range" data-rng="hours" id="rng-hours" min="1" max="12" value="1" step="1"
                        aria-label="이용 시간">
                    <div class="scale"><span>1H</span><span>12H</span></div>
                </div>
            </div>

            <div class="row" id="row-extra">
                <div class="row-h"><span class="row-n">06</span>Extra<em id="v-extra">0시간</em></div>
                <div class="slider">
                    <input type="range" data-rng="extraHours" id="rng-extra" min="0" max="6" value="0" step="1"
                        aria-label="연장 시간">
                    <div class="scale"><span>0H</span><span>6H</span></div>
                </div>
                <p class="note">연장료 = 풀데이 기본요금의 10% / 시간</p>
            </div>

            <div class="row" id="row-options" hidden>
                <div class="row-h"><span class="row-n">07</span>Options<em class="tag">홍대 전용</em></div>
                <div class="opts opts-check">
                    <button data-opt="GREENHOUSE">그린하우스 <b id="p-greenhouse">+5만원/h</b></button>
                    <button data-opt="BACKGARDEN">백가든 <b id="p-backgarden">+5만원/h</b></button>
                </div>
            </div>
        </section>

        <!-- ── 요금표 ───────────────────────────────── -->
        <!-- 엔진 데이터로 표를 그리고, 현재 선택된 칸을 강조한다.
             칸을 누르면 그 조건이 계산기에 그대로 반영된다.
             아래에는 도면이 들어간 원본 요금표 이미지를 붙인다. -->
        <section class="sheet" id="sheet-view" hidden>
            <div class="row">
                <div class="row-h"><span class="row-n">01</span>Studio<em id="v-studio-sheet">한남</em></div>
                <div class="opts" id="opts-studio-sheet"></div>
            </div>
            <div class="sh" id="sheet-body"></div>
        </section>

        <!-- ── 견적서 ───────────────────────────────── -->
        <aside class="dock" id="dock">
            <button class="peek" id="peek" aria-expanded="false" aria-controls="paper">
                <span class="peek-k">Total</span>
                <span class="peek-v" id="peek-v">120만원</span>
                <span class="peek-cue" id="peek-cue">견적서</span>
            </button>

            <div class="paper" id="paper">
                <div class="paper-in">
                    <div class="rc-title">LAYER STUDIOS</div>
                    <div class="rc-meta" id="rc-meta">QUOTATION · 참고용</div>
                    <div id="rc-spec"></div>
                    <div class="rc-rule"></div>
                    <div id="rc-charges"></div>
                    <div id="rc-total"></div>
                    <div id="rc-stamp"></div>
                    <p class="rc-foot">본 견적은 참고용이며 실제 요금과 다를 수 있습니다.<br>정확한 금액은 지점에 문의하세요.</p>
                </div>
            </div>
        </aside>
    </main>

    <div class="dock-scrim" id="dock-scrim"></div>

    <script src="engine.js"></script>
    <script src="app.js"></script>
</body>

</html>
