<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <!-- 지점 주소(/hannam, /layer7 …)로 열려도 상대 경로 파일은 항상 루트에서 찾는다 -->
    <base href="/">
    <title>LAYER STUDIOS — 견적 산출기</title>
    <meta name="theme-color" content="#f6f5f1">

    <!-- SVG를 우선 쓰고, 지원하지 않는 브라우저는 .ico로 떨어진다 -->
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="icon" href="favicon.ico" sizes="16x16 32x32 48x48">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <!-- Pretendard v1.3.9 자체 호스팅 (fonts/). 외부 CDN 의존 없음.
         동적 서브셋이라 브라우저는 화면에 실제 쓰인 글자의 조각만 내려받는다. -->
    <link rel="stylesheet" href="fonts/inter-tight.css">
    <link rel="stylesheet" href="fonts/pretendard.css">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header class="masthead">
        <!-- 본문(.workbench)과 같은 폭·여백으로 맞춘다 -->
        <div class="mh-in">
            <a class="mh-logo" href="./" aria-label="LAYER STUDIOS">
                <img src="logo.png" alt="LAYER STUDIOS" decoding="async">
            </a>
            <!-- 계산기 ↔ 요금표 전환. 요금표는 같은 지점·선택을 공유한다 -->
            <nav class="mh-nav" aria-label="화면 전환">
                <!-- 언어 전환. 누르면 반대 언어로 바뀌고, 라벨은 바꿀 대상 언어를 보여준다 -->
                <button class="mh-lang" id="lang-btn" data-lang-toggle aria-label="English"><span class="on">KR</span><i>/</i><span>EN</span></button>
                <button data-view="calc" class="on" aria-pressed="true" data-i18n="nav_calc">견적</button>
                <button data-view="sheet" aria-pressed="false" data-i18n="nav_sheet">요금표</button>
                <button data-view="info" aria-pressed="false" data-i18n="nav_info">주차·안내</button>
            </nav>
        </div>
    </header>

    <main class="workbench">
        <!-- ── 조작 패널 ────────────────────────────── -->
        <section class="controls">
            <div class="row">
                <div class="row-h"><span class="row-n">01</span><span data-i18n="row_studio">지점</span><em id="v-studio">한남</em></div>
                <div class="opts" id="opts-studio">
                    <button data-set="studio" data-v="HANNAM" class="on">한남</button>
                    <button data-set="studio" data-v="LAYER7">레이어 7</button>
                    <button data-set="studio" data-v="LAYER20">레이어 20</button>
                    <button data-set="studio" data-v="LAYER11">레이어 11</button>
                    <button data-set="studio" data-v="LAYER27">레이어 27</button>
                    <button data-set="studio" data-v="LAYER26">레이어 26</button>
                    <button data-set="studio" data-v="LAYER41">레이어 41</button>
                    <button data-set="studio" data-v="HONGDAE">홍대</button>
                </div>
                <!-- 지점을 고른 직후가 주차·위치가 궁금해지는 때 — 그 지점의 안내 화면으로 바로 간다 (app.js paint가 채운다) -->
                <a class="row-link" id="info-link" href="/hannam/info" data-goto="info">한남 주차 · 오시는 길 →</a>
            </div>

            <div class="row">
                <div class="row-h"><span class="row-n">02</span><span data-i18n="row_part">파트</span><em id="v-part">1F</em></div>
                <div class="opts" id="opts-part"></div>
                <p class="note" data-i18n="note_part">가구 촬영 혹은 차량 내부 진입 시 별도 금액 협의</p>
            </div>

            <div class="row" id="row-type">
                <div class="row-h"><span class="row-n">03</span><span data-i18n="row_type">종류</span><em id="v-type">사진</em></div>
                <div class="opts">
                    <button data-set="type" data-v="photo" class="on" data-i18n="type_photo">사진</button>
                    <button data-set="type" data-v="video" data-i18n="type_video">영상</button>
                </div>
            </div>

            <div class="row">
                <div class="row-h"><span class="row-n">04</span><span data-i18n="row_personnel">인원</span><em id="v-personnel">10명</em></div>
                <div class="slider">
                    <div class="track">
                        <input type="range" data-rng="personnel" id="rng-personnel" min="1" max="80" value="10" step="1"
                            aria-label="촬영 인원">
                        <!-- 요금이 바뀌는 인원 구간의 끝. app.js renderTicks가 지점별로 채운다 -->
                        <div class="ticks" id="ticks-personnel" aria-hidden="true"></div>
                    </div>
                    <div class="scale" id="scale-personnel"><span>1명</span><span>80명</span></div>
                </div>
            </div>

            <div class="row" id="row-time">
                <div class="row-h"><span class="row-n">05</span><span data-i18n="row_time">시간</span><em id="v-time">Day 9시간</em></div>
                <div class="opts" id="time-dayhalf">
                    <button data-set="time" data-v="day" class="on" data-i18n="day9">Day 9시간</button>
                    <button data-set="time" data-v="half" data-i18n="half4">Half 4시간</button>
                </div>
                <div class="slider" id="time-hourly" hidden>
                    <input type="range" data-rng="hours" id="rng-hours" min="1" max="12" value="1" step="1"
                        aria-label="이용 시간">
                    <div class="scale" id="scale-hours"><span>1시간</span><span>12시간</span></div>
                </div>
            </div>

            <div class="row" id="row-extra">
                <div class="row-h"><span class="row-n">06</span><span data-i18n="row_extra">연장</span><em id="v-extra">0시간</em></div>
                <div class="slider">
                    <input type="range" data-rng="extraHours" id="rng-extra" min="0" max="6" value="0" step="1"
                        aria-label="연장 시간">
                    <div class="scale" id="scale-extra"><span>0시간</span><span>6시간</span></div>
                </div>
                <p class="note" data-i18n="note_extra">연장료 = 풀데이 기본요금의 10% / 시간</p>
            </div>

            <div class="row" id="row-options" hidden>
                <div class="row-h"><span class="row-n">07</span><span data-i18n="row_options">옵션</span><em class="tag" data-i18n="tag_hongdae">홍대 전용</em></div>
                <div class="opts opts-check">
                    <button data-opt="GREENHOUSE"><span data-i18n="opt_greenhouse">그린하우스</span> <b id="p-greenhouse">+4만원/시간</b></button>
                    <!-- 백가든은 전관(16인 이상)에서만 추가 옵션. 시간제 A 는 백가든이 포함된 요금이다 -->
                    <button data-opt="BACKGARDEN" hidden><span data-i18n="opt_backgarden">백가든</span> <b id="p-backgarden"></b></button>
                </div>
            </div>
        </section>

        <!-- ── 요금표 ───────────────────────────────── -->
        <!-- 엔진 데이터로 표를 그리고, 현재 선택된 칸을 강조한다.
             칸을 누르면 그 조건이 계산기에 그대로 반영된다.
             아래에는 도면이 들어간 원본 요금표 이미지를 붙인다. -->
        <section class="sheet" id="sheet-view" hidden>
            <div class="row">
                <div class="row-h"><span class="row-n">01</span><span data-i18n="row_studio">지점</span><em id="v-studio-sheet">한남</em></div>
                <div class="opts" id="opts-studio-sheet"></div>
            </div>
            <div class="sh" id="sheet-body"></div>
        </section>

        <!-- ── 안내 ─────────────────────────────────── -->
        <!-- 지점별 주소 · 오시는 길 · 주차 · 발전차 · 전력. 내용은 info.js -->
        <section class="sheet info" id="info-view" hidden>
            <div class="row">
                <div class="row-h"><span class="row-n">01</span><span data-i18n="row_studio">지점</span><em id="v-studio-info">한남</em></div>
                <div class="opts" id="opts-studio-info"></div>
            </div>
            <div id="info-body"></div>
        </section>

        <!-- ── 견적서 ───────────────────────────────── -->
        <aside class="dock" id="dock">
            <button class="peek" id="peek" aria-expanded="false" aria-controls="paper">
                <span class="peek-k" data-i18n="sum">합계</span>
                <span class="peek-v" id="peek-v">120만원</span>
                <span class="peek-cue" id="peek-cue">견적서</span>
            </button>

            <div class="paper" id="paper">
                <div class="paper-in">
                    <div class="rc-head">
                        <div class="rc-title" data-i18n="rc_title">견적서</div>
                        <!-- 견적 내용을 글자로 복사 — 메신저·메일에 바로 붙인다. 내용은 app.js paint가 채운다 -->
                        <button class="copy" id="rc-copy" data-i18n="rc_copy">견적 복사</button>
                    </div>
                    <div class="rc-meta" id="rc-meta">LAYER STUDIOS</div>
                    <div id="rc-spec"></div>
                    <div class="rc-rule"></div>
                    <div id="rc-charges"></div>
                    <div id="rc-total"></div>
                    <div id="rc-stamp"></div>
                    <!-- 지금 견적을 A4 문서로 연다 (app.js renderDoc) -->
                    <button class="rc-doc" id="doc-open" data-i18n="doc_open">가견적서 만들기</button>
                    <p class="rc-foot" data-i18n-html="rc_foot">모든 금액은 부가세(VAT 10%) 별도입니다.<br>본 견적은 참고용이며 실제 요금과 다를 수 있습니다.<br>정확한 금액은 지점에 문의하세요.</p>
                </div>
            </div>
        </aside>
    </main>

    <div class="dock-scrim" id="dock-scrim"></div>

    <!-- 채널톡 문의 — 메인 사이트(plusjun.com) 오른쪽 아래 버튼(.layer-chat-btn)과 같은 모양·같은 채널.
         채널톡이 준비되면 나타난다 (app.js) -->
    <button type="button" class="chat" id="chat-btn" hidden aria-label="채널톡 문의">
        <svg class="chat-bubble" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" aria-hidden="true">
            <path d="M4 5.5A1.5 1.5 0 0 1 5.5 4h9M20 9.5v5a1.5 1.5 0 0 1-1.5 1.5H11l-4.5 4v-4h-1A1.5 1.5 0 0 1 4 14.5v-9"/>
            <circle cx="19" cy="5" r="1.6" fill="currentColor" stroke="none"/>
            <circle class="chat-ring" cx="19" cy="5" r="1.6" stroke-width="1"/>
        </svg>
        <svg class="chat-x" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
        <span class="chat-badge"></span>
    </button>

    <!-- ── 가견적서 — 화면 전체를 덮는 A4 문서. 인쇄하면 이 종이만 나온다 ── -->
    <div class="doc" id="doc" hidden role="dialog" aria-modal="true" aria-labelledby="doc-pdf">
        <div class="doc-bar">
            <button data-doc-close data-i18n="doc_close">닫기</button>
            <span class="doc-acts">
                <button class="doc-print" data-doc-print data-i18n="doc_print">인쇄</button>
                <!-- 인쇄 창을 거치지 않고 PDF 파일을 바로 받는다 — 브라우저가 찍는 머리글·바닥글이 없다 (app.js downloadPdf) -->
                <button class="doc-go" id="doc-pdf" data-doc-pdf data-i18n="doc_pdf">PDF 미리보기</button>
            </span>
        </div>
        <!-- 좁은 화면에서만 보이는 입력 칸. 아래 종이는 축소된 미리보기라 여기서 적는다 -->
        <form class="doc-form" id="doc-form" onsubmit="return false">
            <label><span data-i18n="doc_to">수신</span><input data-doc="to" autocomplete="off"></label>
            <label><span data-i18n="doc_shoot">촬영 예정일</span><input data-doc="shoot" autocomplete="off"></label>
            <label><span data-i18n="doc_memo">비고</span><textarea data-doc="memo" rows="1"></textarea></label>
        </form>
        <!-- 종이는 늘 A4 폭(794px)으로 짜고, 화면이 좁으면 통째로 축소한다 (app.js fitDoc) -->
        <div class="doc-fit" id="doc-fit"><article class="doc-page" id="doc-page"></article></div>

        <!-- PDF 미리보기 — 저장될 그림을 그대로 보여 주고, 확인한 뒤 다운로드한다 (app.js openPdfPreview) -->
        <div class="pdf-prev" id="pdf-prev" hidden role="dialog" aria-modal="true">
            <div class="doc-bar">
                <button data-prev-close data-i18n="prev_back">← 수정하기</button>
                <span class="doc-acts">
                    <span class="prev-note" data-i18n="prev_note">이 모양 그대로 저장됩니다</span>
                    <button class="doc-go" id="pdf-save" data-pdf-save data-i18n="prev_save">다운로드</button>
                </span>
            </div>
            <div class="pdf-prev-body" id="pdf-prev-body"></div>
        </div>
    </div>

    <script src="engine.js"></script>
    <script src="info.js"></script>
    <script src="app.js"></script>
</body>

</html>
